[package]
name = "kerfin"
version = "0.1.0"
description = "Kerfin personal finance"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
